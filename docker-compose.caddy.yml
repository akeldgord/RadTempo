services:
  app:
    # Caddy reverse-proxies to `app` on the compose network; no need to
    # publish the app port on the host in this mode.
    ports: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - radtempo_caddy_data:/data
      - radtempo_caddy_config:/config

volumes:
  radtempo_caddy_data:
  radtempo_caddy_config:
