name: E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'main')

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: radtempo
          POSTGRES_PASSWORD: radtempo
          POSTGRES_DB: radtempo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radtempo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e
        env:
          DATABASE_URL: postgres://radtempo:radtempo@localhost:5432/radtempo_e2e
          E2E_DATABASE_URL: postgres://radtempo:radtempo@localhost:5432/radtempo_e2e
          AUTH_SECRET: dummy-ci-secret-not-for-production-use-only
          SETUP_TOKEN: dummy-ci-setup-token-not-for-production-use-only
          APP_URL: http://localhost:3000
          # Unset: CI installs its own Playwright browsers via
          # `playwright install --with-deps`, unlike the local
          # /opt/pw-browsers checkout used for local development.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
